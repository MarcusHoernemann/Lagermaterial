<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📦 Materiallager</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a24">
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        :root {
            --primary: #1a1a24;
            --secondary: #2a2a36;
            --accent: #0ea5e9;
            --bg: #121218;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --input-bg: #1e1e28;
            --border: #334155;
            --danger: #ef4444;
            --warning: #ffcc00;
        }
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: var(--bg); 
            color: var(--text); 
        }
        header { 
            background: var(--primary); 
            padding: 1rem; 
            text-align: center; 
            border-bottom: 1px solid var(--border);
        }
        h1, h2, h3 { margin-top: 0; }
        
        nav { 
            display: flex; 
            background: var(--primary); 
            border-bottom: 1px solid var(--border);
        }
        nav button { 
            flex: 1; 
            padding: 1rem; 
            border: none; 
            background: none; 
            color: var(--text-muted); 
            cursor: pointer; 
            font-size: 1rem; 
            transition: all 0.2s;
        }
        nav button.active { 
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
            font-weight: bold; 
        }
        .container { 
            padding: 1rem; 
            max-width: 800px; 
            margin: auto; 
        }
        .view { display: none; }
        .view.active { display: block; }
        
        .card { 
            background: var(--secondary); 
            padding: 1rem; 
            border-radius: 8px; 
            margin-bottom: 1rem; 
            border: 1px solid var(--border);
        }
        input, select, textarea { 
            width: 100%; 
            padding: 0.8rem; 
            margin-bottom: 1rem; 
            border: 1px solid var(--border); 
            border-radius: 4px; 
            box-sizing: border-box; 
            font-size: 1rem; 
            background: var(--input-bg);
            color: var(--text);
        }
        button {
            width: 100%; 
            padding: 0.8rem; 
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            color: white;
            transition: 0.2s;
        }
        button.primary { background: var(--accent); font-weight: bold; }
        button.primary:hover { background: #0284c7; }
        button.danger { background: var(--danger); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .item-card { 
            background: var(--secondary); 
            border-radius: 8px; 
            margin-bottom: 1rem; 
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .item-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background: var(--primary);
            display: none;
        }
        .item-content { padding: 1rem; }
        .item-title { 
            font-weight: bold; 
            font-size: 1.2rem; 
            margin-bottom: 0.5rem; 
        }
        .item-detail { 
            font-size: 0.9rem; 
            color: var(--text-muted); 
            margin-bottom: 0.5rem;
        }
        
        .badge { 
            display: inline-block; 
            padding: 0.2rem 0.5rem; 
            border-radius: 4px; 
            font-size: 0.8rem; 
            margin-right: 0.5rem; 
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        .badge-mat { background: #334155; color: #cbd5e1; }
        .badge-bg { background: var(--warning); color: #000; }
        .badge-amount { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
        
        .search-area {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1rem;
        }
        @media (max-width: 600px) {
            .search-area { grid-template-columns: 1fr; gap: 0; }
        }

        .image-preview {
            max-width: 100%;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: none;
        }
        .action-row {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--border);
            justify-content: flex-end;
        }
        .action-row button {
            padding: 0.4rem 1rem;
            font-size: 0.85rem;
            width: auto;
            border-radius: 20px;
        }
        .btn-edit { background: #475569; }
        .btn-delete { background: transparent; border: 1px solid var(--danger); color: var(--danger); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none; justify-content: center; align-items: center;
            z-index: 1000; padding: 1rem;
        }
        .modal {
            background: var(--secondary);
            padding: 1.5rem;
            border-radius: 8px;
            width: 100%; max-width: 400px;
            border: 1px solid var(--border);
        }
        
        /* Setup Code Styling */
        .code-display {
            font-size: 2rem;
            letter-spacing: 0.5rem;
            text-align: center;
            font-weight: bold;
            color: var(--accent);
            background: var(--primary);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        
        /* Toast Notification */
        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--accent); color: white; padding: 0.8rem 1.5rem;
            border-radius: 30px; font-weight: bold; display: none; z-index: 2000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <header>
        <h1>📦 Materiallager</h1>
    </header>
    <nav>
        <button id="nav-list" class="active" onclick="switchView('list')">Bestand</button>
        <button id="nav-add" onclick="switchView('add')">Neu erfassen</button>
        <button id="nav-cloud" onclick="switchView('cloud')">Einstellungen</button>
    </nav>

    <div class="container">
        <!-- LAGERBESTAND VIEW -->
        <div id="view-list" class="view active">
            <div class="search-area">
                <input type="text" id="searchInput" placeholder="Suche (Material, Mat. Nr., Baugruppe)...">
                <select id="filterBaugruppe">
                    <option value="">Alle Baugruppen</option>
                </select>
            </div>
            <div id="inventoryList">
                <p>Lade Daten...</p>
            </div>
        </div>

        <!-- HINZUFÜGEN VIEW -->
        <div id="view-add" class="view">
            <div class="card">
                <h2>Neues Material erfassen</h2>
                <input type="text" id="inputMaterial" placeholder="Material (z.B. M8 Schraube)" required>
                <input type="text" id="inputMatNum" placeholder="Materialnummer (z.B. 100234)" required>
                <textarea id="inputDesc" placeholder="Beschreibung (Optional)" rows="2"></textarea>
                
                <select id="inputBaugruppe" required>
                    <option value="" disabled selected>Baugruppe auswählen...</option>
                </select>
                
                <input type="number" id="inputAmount" placeholder="Benötigte Anzahl (Optional)">
                
                <div class="card" style="background: var(--primary); padding: 0.5rem; margin-bottom: 1rem;">
                    <input type="file" id="inputImage" accept="image/*" style="display: none;" onchange="handleImageSelection(event)">
                    <button class="primary" style="background: var(--border); margin-bottom: 0.5rem;" onclick="document.getElementById('inputImage').click()">
                        📷 Foto aufnehmen / auswählen
                    </button>
                    <img id="imagePreview" class="image-preview" alt="Vorschau">
                    <p id="imageStatus" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0; display: none;">Bild wird verarbeitet...</p>
                </div>
                
                <button id="btnSaveItem" class="primary" onclick="saveItem()">Bauteil speichern</button>
            </div>
        </div>

        <!-- EINSTELLUNGEN VIEW -->
        <div id="view-cloud" class="view">
            <div class="card">
                <h2>Lager-Verbindung</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Dein aktueller Lager-Code. Gib diesen Code auf anderen Geräten ein, um sie zu verbinden.</p>
                <div id="displayCloudCode" class="code-display">------</div>
                
                <div style="border-top: 1px solid var(--border); margin-top: 1.5rem; padding-top: 1rem;">
                    <h3>Mit anderem Lager verbinden</h3>
                    <input type="text" id="inputJoinCode" placeholder="6-stelligen Code eingeben" maxlength="6" style="text-transform: uppercase;">
                    <button class="primary" onclick="joinLager()">Lager wechseln</button>
                </div>
            </div>
            
            <div class="card">
                <h2>Baugruppen verwalten</h2>
                <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
                    <input type="text" id="inputNewBaugruppe" placeholder="Neue Baugruppe (z.B. Elektrik)" style="margin-bottom:0;">
                    <button class="primary" style="width: auto;" onclick="addBaugruppe()">Hinzufügen</button>
                </div>
                <div id="baugruppenList"></div>
            </div>
        </div>
    </div>

    <!-- EDIT MODAL -->
    <div id="editModal" class="modal-overlay">
        <div class="modal">
            <h3 style="margin-top:0;">Bauteil bearbeiten</h3>
            <input type="hidden" id="editId">
            <input type="text" id="editMaterial" placeholder="Material">
            <input type="text" id="editMatNum" placeholder="Materialnummer">
            <select id="editBaugruppe"></select>
            <input type="number" id="editAmount" placeholder="Anzahl">
            <textarea id="editDesc" placeholder="Beschreibung" rows="2"></textarea>
            
            <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                <button onclick="closeEditModal()" style="background: var(--border);">Abbrechen</button>
                <button class="primary" onclick="saveEdit()">Speichern</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Nachricht</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Config (Ruhrbahnlager)
        const firebaseConfig = {
            apiKey: "AIzaSyBrfZ7suC_mFpQwCJgbZhBIPMX1j5Pn3j4",
            authDomain: "ruhrbahnlager.firebaseapp.com",
            projectId: "ruhrbahnlager",
            storageBucket: "ruhrbahnlager.firebasestorage.app",
            messagingSenderId: "395587497413",
            appId: "1:395587497413:web:64f7841e2bf2b1b7cdafac",
            measurementId: "G-F8KDDCRC1W"
        };

        let db;
        let items = [];
        let baugruppen = [];
        let currentBase64Image = null;
        let cloudCode = "";

        window.switchView = function(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById('view-' + viewId).classList.add('active');
            document.getElementById('nav-' + viewId).classList.add('active');
        };

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.background = isError ? "var(--danger)" : "var(--accent)";
            t.style.display = "block";
            setTimeout(() => { t.style.display = "none"; }, 3000);
        }

        // Setup Cloud Code Logic
        function initCodeLogic() {
            cloudCode = localStorage.getItem('lagerCloudCode');
            if (!cloudCode) {
                // Generate a random 6 character code if none exists
                cloudCode = Math.random().toString(36).substring(2, 8).toUpperCase();
                localStorage.setItem('lagerCloudCode', cloudCode);
            }
            document.getElementById('displayCloudCode').innerText = cloudCode;
        }

        window.joinLager = function() {
            const newCode = document.getElementById('inputJoinCode').value.trim().toUpperCase();
            if (newCode.length === 6) {
                localStorage.setItem('lagerCloudCode', newCode);
                showToast("Lager gewechselt! Lade neu...");
                setTimeout(() => location.reload(), 1500);
            } else {
                showToast("Code muss 6 Zeichen lang sein.", true);
            }
        };

        function initFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                listenToBaugruppen();
                listenToData();
            } catch (e) {
                console.error("Firebase init fehler", e);
                showToast("Datenbankfehler!", true);
            }
        }

        // Baugruppen Logik
        function listenToBaugruppen() {
            const q = query(collection(db, "baugruppen_" + cloudCode), orderBy("name"));
            onSnapshot(q, (snapshot) => {
                baugruppen = [];
                snapshot.forEach(doc => {
                    baugruppen.push({ id: doc.id, name: doc.data().name });
                });
                renderBaugruppenAdmin();
                updateBaugruppenDropdowns();
            });
        }

        window.addBaugruppe = function() {
            const val = document.getElementById('inputNewBaugruppe').value.trim();
            if (!val) return;
            
            // Im Hintergrund speichern
            addDoc(collection(db, "baugruppen_" + cloudCode), { name: val }).catch(console.error);
            
            document.getElementById('inputNewBaugruppe').value = '';
            showToast("Baugruppe hinzugefügt");
        };

        window.deleteBaugruppe = function(id, btn) {
            if (btn.dataset.confirm !== "true") {
                btn.dataset.confirm = "true";
                btn.innerText = "Sicher?";
                btn.style.background = "var(--danger)";
                btn.style.color = "white";
                setTimeout(() => {
                    btn.dataset.confirm = "false";
                    btn.innerText = "Löschen";
                    btn.style.background = "transparent";
                    btn.style.color = "var(--danger)";
                }, 3000);
                return;
            }
            
            // Im Hintergrund löschen
            deleteDoc(doc(db, "baugruppen_" + cloudCode, id)).catch(console.error);
            showToast("Gelöscht!");
        };

        function renderBaugruppenAdmin() {
            const list = document.getElementById('baugruppenList');
            list.innerHTML = '';
            baugruppen.forEach(bg => {
                const div = document.createElement('div');
                div.style = "display:flex; justify-content:space-between; padding:0.5rem; border-bottom:1px solid var(--border);";
                div.innerHTML = `
                    <span>⚙️ ${bg.name}</span>
                    <button class="btn-delete" style="width:auto; padding:0.2rem 0.5rem;" onclick="deleteBaugruppe('${bg.id}', this)">Löschen</button>
                `;
                list.appendChild(div);
            });
        }

        function updateBaugruppenDropdowns() {
            const selectAdd = document.getElementById('inputBaugruppe');
            const selectEdit = document.getElementById('editBaugruppe');
            const selectFilter = document.getElementById('filterBaugruppe');
            
            const currentFilter = selectFilter.value;
            
            let opts = '<option value="" disabled selected>Bitte wählen...</option>';
            let filterOpts = '<option value="">Alle Baugruppen</option>';
            
            baugruppen.forEach(bg => {
                opts += `<option value="${bg.name}">${bg.name}</option>`;
                filterOpts += `<option value="${bg.name}">${bg.name}</option>`;
            });
            
            selectAdd.innerHTML = opts;
            selectEdit.innerHTML = opts;
            selectFilter.innerHTML = filterOpts;
            selectFilter.value = currentFilter;
        }

        window.handleImageSelection = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const preview = document.getElementById('imagePreview');
            const status = document.getElementById('imageStatus');
            
            status.style.display = 'block';
            status.innerText = "Bild wird optimiert...";
            status.style.color = "var(--text-muted)";

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const MAX_SIZE = 600;

                    if (width > height && width > MAX_SIZE) {
                        height *= MAX_SIZE / width;
                        width = MAX_SIZE;
                    } else if (height > MAX_SIZE) {
                        width *= MAX_SIZE / height;
                        height = MAX_SIZE;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.6);
                    currentBase64Image = compressedDataUrl;
                    
                    preview.src = compressedDataUrl;
                    preview.style.display = 'block';
                    status.innerText = "✅ Bild bereit.";
                    status.style.color = "#10b981";
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.saveItem = function() {
            const material = document.getElementById('inputMaterial').value.trim();
            const matNum = document.getElementById('inputMatNum').value.trim();
            const desc = document.getElementById('inputDesc').value.trim();
            const baugruppe = document.getElementById('inputBaugruppe').value;
            const amount = document.getElementById('inputAmount').value.trim();

            if (!material || !matNum || !baugruppe) {
                showToast("Bitte alle Pflichtfelder (außer Anzahl) ausfüllen.", true);
                return;
            }

            const btn = document.getElementById('btnSaveItem');
            btn.innerText = "Wird gespeichert...";
            btn.disabled = true;

            const docData = {
                material: material,
                materialnummer: matNum,
                beschreibung: desc,
                baugruppe: baugruppe,
                anzahl: amount === "" ? 0 : Number(amount),
                timestamp: Date.now()
            };

            if (currentBase64Image) {
                docData.bild = currentBase64Image;
            }

            // Fire-and-Forget: Im Hintergrund hochladen, UI wird NICHT blockiert!
            addDoc(collection(db, "lagerbestand_" + cloudCode), docData).catch(e => {
                console.error("Speicherfehler:", e);
            });
            
            // Formular SOFORT leeren
            document.getElementById('inputMaterial').value = '';
            document.getElementById('inputMatNum').value = '';
            document.getElementById('inputDesc').value = '';
            document.getElementById('inputBaugruppe').value = '';
            document.getElementById('inputAmount').value = '';
            
            // Bild zurücksetzen
            document.getElementById('inputImage').value = '';
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('imageStatus').style.display = 'none';
            currentBase64Image = null;
            
            showToast("Bauteil gespeichert!");
            
            // Button SOFORT wieder freigeben
            btn.innerText = "Bauteil speichern";
            btn.disabled = false;
        };

        function listenToData() {
            const q = query(collection(db, "lagerbestand_" + cloudCode), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                items = [];
                snapshot.forEach((doc) => {
                    items.push({ id: doc.id, ...doc.data() });
                });
                renderList();
            });
        }

        window.renderList = function() {
            const listEl = document.getElementById('inventoryList');
            const searchTxt = document.getElementById('searchInput').value.toLowerCase();
            const filterBg = document.getElementById('filterBaugruppe').value;

            listEl.innerHTML = '';

            const filtered = items.filter(item => {
                const matchSearch = (item.material || '').toLowerCase().includes(searchTxt) || 
                                    (item.baugruppe || '').toLowerCase().includes(searchTxt) ||
                                    (item.materialnummer || '').toLowerCase().includes(searchTxt);
                const matchFilter = filterBg === "" || item.baugruppe === filterBg;
                return matchSearch && matchFilter;
            });

            // Alphabetisch nach Materialnamen sortieren (ignoriert Groß-/Kleinschreibung und beachtet Umlaute)
            filtered.sort((a, b) => (a.material || '').localeCompare(b.material || '', 'de', { sensitivity: 'base' }));

            if (filtered.length === 0) {
                listEl.innerHTML = '<p style="color:var(--text-muted);">Keine Bauteile gefunden.</p>';
                return;
            }

            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = 'item-card';
                
                let imgHtml = '';
                if(item.bild) {
                    imgHtml = `<img src="${item.bild}" class="item-image" style="display:block;">`;
                }

                div.innerHTML = `
                    ${imgHtml}
                    <div class="item-content">
                        <div class="item-title">${item.material}</div>
                        <div>
                            <span class="badge badge-mat">Mat. Nr. ${item.materialnummer}</span>
                            <span class="badge badge-bg">⚙️ ${item.baugruppe}</span>
                            <span class="badge badge-amount">ben. ${item.anzahl} Stk.</span>
                        </div>
                        ${item.beschreibung ? `<div class="item-detail">${item.beschreibung}</div>` : ''}
                        
                        <div class="action-row">
                            <button class="btn-edit" onclick="openEditModal('${item.id}')">Bearbeiten</button>
                            <button class="btn-delete" onclick="deleteItem('${item.id}', this)">Löschen</button>
                        </div>
                    </div>
                `;
                listEl.appendChild(div);
            });
        };

        window.deleteItem = function(id, btn) {
            if (btn.dataset.confirm !== "true") {
                btn.dataset.confirm = "true";
                btn.innerText = "Sicher?";
                btn.style.background = "var(--danger)";
                btn.style.color = "white";
                setTimeout(() => {
                    btn.dataset.confirm = "false";
                    btn.innerText = "Löschen";
                    btn.style.background = "transparent";
                    btn.style.color = "var(--danger)";
                }, 3000);
                return;
            }
            
            // Im Hintergrund löschen
            deleteDoc(doc(db, "lagerbestand_" + cloudCode, id)).catch(console.error);
            showToast("Bauteil entfernt.");
        };

        window.openEditModal = function(id) {
            const item = items.find(i => i.id === id);
            if(!item) return;
            
            document.getElementById('editId').value = item.id;
            document.getElementById('editMaterial').value = item.material || '';
            document.getElementById('editMatNum').value = item.materialnummer || '';
            document.getElementById('editBaugruppe').value = item.baugruppe || '';
            document.getElementById('editAmount').value = item.anzahl || 0;
            document.getElementById('editDesc').value = item.beschreibung || '';
            
            document.getElementById('editModal').style.display = 'flex';
        };

        window.closeEditModal = function() {
            document.getElementById('editModal').style.display = 'none';
        };

        window.saveEdit = function() {
            const id = document.getElementById('editId').value;
            const material = document.getElementById('editMaterial').value.trim();
            const matNum = document.getElementById('editMatNum').value.trim();
            const baugruppe = document.getElementById('editBaugruppe').value;
            const amount = document.getElementById('editAmount').value;
            const desc = document.getElementById('editDesc').value.trim();

            if (!material || !matNum || !baugruppe) {
                showToast("Bitte Material, Materialnummer und Baugruppe ausfüllen", true);
                return;
            }

            // Im Hintergrund aktualisieren
            updateDoc(doc(db, "lagerbestand_" + cloudCode, id), {
                material: material,
                materialnummer: matNum,
                baugruppe: baugruppe,
                anzahl: amount === "" ? 0 : Number(amount),
                beschreibung: desc
            }).catch(console.error);
            
            closeEditModal();
            showToast("Änderungen gespeichert!");
        };

        // Event Listener für Suche
        document.getElementById('searchInput').addEventListener('input', renderList);
        document.getElementById('filterBaugruppe').addEventListener('change', renderList);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    }, err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }

        // App starten
        initCodeLogic();
        initFirebase();
    </script>
</body>
</html>
